<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
  href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body{ text-align: center; font-family: Arial, sans-serif; background-color: beige;}
    .card{border: 2px solid olive;text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 20px; background-color: bisque;}
h1{ text-align: center; color: blueviolet;}
.card h3{ text-align: center; color: blueviolet;}
  </style>
</head>
<body>
<h1> Hobby Cards</h1>
<div class="container">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4" >
            <div class="card"> 
            <h3> Drawing</h3>
            <p> I love sketching animals and comic characters</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4" card>
             <div class="card"> 
            <h3> Football</h3>
            <p> I play football every evening with my friends</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4" card>
            <div class="card"> 
            <h3> Reading</h3>
            <p> My favourite books are adventure stories</p>
            </div>
        </div>
    </div>
</div>





 <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
</script>   
</body>
</html>
